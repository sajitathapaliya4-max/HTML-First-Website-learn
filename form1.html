<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple HTML Form</title>
  <style>
    /* Basic styling to make the form look neat */
    form {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: Arial, sans-serif;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <form action="/submit" method="POST">
    <h2>Contact Us</h2>

    <!-- Text Input -->
    <label for="name">Name:</label>
    <input type="text" id="name" name="userName" placeholder="John Doe" required>

    <!-- Email Input -->
    <label for="email">Email:</label>
    <input type="email" id="email" name="userEmail" placeholder="example@mail.com" required>

    <!-- Dropdown / Select Option -->
    <label for="subject">Subject:</label>
    <select id="subject" name="subject">
      <option value="general">General Inquiry</option>
      <option value="support">Customer Support</option>
      <option value="feedback">Feedback</option>
    </select>

    <!-- Textarea for Longer Messages -->
    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="4" placeholder="Write your message here..."></textarea>

    <!-- Submit Button -->
    <button type="submit">Send Message</button>
  </form>

</body>
</html>
